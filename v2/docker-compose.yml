version: '3.8'

services:
  eeg2video:
    build:
      context: .
      dockerfile: Dockerfile
    image: eeg2video:latest
    container_name: eeg2video
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - CUDA_VISIBLE_DEVICES=0,1,2,3,4,5,6,7  # All 8 V100s
    volumes:
      # Mount your code
      - ~/EEG_Reconstruction:/workspace
      # Mount your dataset directory
      - /local-scratch/marios-datasets:/data
    shm_size: '32gb'  # Increase shared memory for DataLoader workers
    ipc: host
    stdin_open: true
    tty: true
    command: /bin/bash
